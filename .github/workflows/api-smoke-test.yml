name: API smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_app
          POSTGRES_USER: school_app
          POSTGRES_PASSWORD: school_app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U school_app -d school_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://school_app:school_app_password@localhost:5432/school_app
      JWT_SECRET: ci-test-secret-not-for-production
      LICENSE_GRACE_DAYS: 14
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_ADMIN_EMAIL: admin@school.com
      PORT: 4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: api
        run: npm ci

      - name: Type-check and build
        working-directory: api
        run: npm run build

      - name: Start API in the background
        working-directory: api
        run: |
          nohup node dist/index.js > api-server.log 2>&1 &
          echo $! > api-server.pid

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health > /dev/null; then
              echo "API is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          cat api/api-server.log
          exit 1

      - name: Run endpoint smoke test
        working-directory: api
        env:
          BASE_URL: http://localhost:4000
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-admin-password
        run: ./scripts/smoke-test.sh

      - name: Show API server logs
        if: always()
        working-directory: api
        run: cat api-server.log || true

      - name: Stop API
        if: always()
        working-directory: api
        run: kill "$(cat api-server.pid)" 2>/dev/null || true
